databases:
  - name: jobbot-db
    plan: free
    databaseName: jobbot
    user: jobbot

services:
  - type: cron
    name: linkedin-job-bot
    runtime: python
    schedule: "0 */2 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobbot-db
          property: connectionString
      - key: JOBBOT_LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.10.0
      # Placeholders for manual configuration in Dashboard
      - key: JOBBOT_SMTP_HOST
        sync: false
      - key: JOBBOT_SMTP_PORT
        sync: false
      - key: JOBBOT_SMTP_USER
        sync: false
      - key: JOBBOT_SMTP_PASS
        sync: false
      - key: JOBBOT_TO_EMAIL
        sync: false
      - key: LINKEDIN_EMAIL
        sync: false
      - key: LINKEDIN_PASSWORD
        sync: false
